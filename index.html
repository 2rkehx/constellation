<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>별자리 위로 — 익명 감정 통</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 밤하늘 별 배경 -->
  <div class="sky" aria-hidden="true">
    <div class="sky__glow"></div>
    <div class="stars" id="stars"></div>
  </div>

  <main class="page">
    <!-- HERO: 오늘의 마음을 내려놓는 자리 -->
    <header class="hero">
      <p class="eyebrow">익명 감정 통 · 위로 릴레이</p>
      <h1 class="hero__title">오늘의 마음,<br />여기에 내려놓으세요</h1>
      <p class="hero__sub">
        학업과 일상에 지친 마음을 익명으로 털어놓으면,<br />
        누군가가 따뜻한 위로의 불빛을 전해줍니다.
      </p>
    </header>

    <!-- 감정 통: 글 작성 -->
    <section class="compose" aria-label="감정 남기기">
      <div class="compose__card">
        <div class="compose__head">
          <span class="compose__label">무엇이 마음을 무겁게 하나요?</span>
          <button type="button" class="nick" id="nickBtn" title="익명 이름 다시 뽑기" aria-label="익명 이름 다시 뽑기">
            <span class="nick__dot"></span>
            <span id="nickName">익명의 별</span>
            <span class="nick__dice" aria-hidden="true">⟲</span>
          </button>
        </div>

        <textarea id="body" class="compose__ta" rows="3" maxlength="500"
          placeholder="터놓고 싶은 이야기를 적어보세요. 누구도 당신이 누군지 알지 못합니다."></textarea>

        <div class="compose__mood" role="radiogroup" aria-label="지금 감정">
          <button type="button" class="mood" data-mood="지침">😮‍💨 지침</button>
          <button type="button" class="mood" data-mood="불안">😰 불안</button>
          <button type="button" class="mood" data-mood="외로움">🥀 외로움</button>
          <button type="button" class="mood" data-mood="슬픔">💧 슬픔</button>
          <button type="button" class="mood" data-mood="분노">🔥 분노</button>
          <button type="button" class="mood" data-mood="무기력">🌫️ 무기력</button>
          <button type="button" class="mood" data-mood="막막">🧭 막막</button>
        </div>

        <div class="compose__foot">
          <span class="count" id="count">0 / 500</span>
          <button type="button" class="btn-primary" id="submit" disabled>마음 내려놓기</button>
        </div>
      </div>
    </section>

    <!-- 위로 릴레이: 감정글 목록 -->
    <section class="feed" aria-label="모두의 감정">
      <div class="feed__head">
        <h2 class="feed__title">밤하늘에 뜬 마음들</h2>
        <span class="feed__live"><span class="live-dot"></span>실시간</span>
      </div>
      <div class="feed__list" id="feed"></div>
      <p class="feed__empty" id="empty" hidden>아직 내려놓인 마음이 없어요. 첫 번째 별이 되어보세요.</p>
    </section>

    <footer class="foot">
      <p>모든 글은 익명으로만 남습니다. 이름은 매번 새로 뽑을 수 있어요.</p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
